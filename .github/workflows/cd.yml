name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to publish and deploy
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: Publish immutable images
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      backend_subject: ${{ steps.images.outputs.backend_subject }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      frontend_subject: ${{ steps.images.outputs.frontend_subject }}
      source_sha: ${{ steps.images.outputs.source_sha }}
    steps:
      - name: Check out verified source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.git_ref }}

      - name: Define immutable image names
        id: images
        shell: bash
        run: |
          repository="${GITHUB_REPOSITORY,,}"
          source_sha="$(git rev-parse HEAD)"
          short_sha="${source_sha:0:12}"
          {
            echo "backend_subject=${REGISTRY}/${repository}-backend"
            echo "backend_image=${REGISTRY}/${repository}-backend:sha-${short_sha}"
            echo "frontend_subject=${REGISTRY}/${repository}-frontend"
            echo "frontend_image=${REGISTRY}/${repository}-frontend:sha-${short_sha}"
            echo "source_sha=${source_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile.production
          push: true
          tags: ${{ steps.images.outputs.backend_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.images.outputs.source_sha }}
          cache-from: type=gha,scope=cd-backend
          cache-to: type=gha,mode=max,scope=cd-backend
          provenance: mode=max
          sbom: true

      - name: Attest backend provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.backend_subject }}
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.production
          push: true
          tags: ${{ steps.images.outputs.frontend_image }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.images.outputs.source_sha }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_AMAP_JS_KEY=${{ vars.VITE_AMAP_JS_KEY }}
            VITE_AMAP_SECURITY_CODE=${{ vars.VITE_AMAP_SECURITY_CODE }}
          cache-from: type=gha,scope=cd-frontend
          cache-to: type=gha,mode=max,scope=cd-frontend
          provenance: mode=max
          sbom: true

      - name: Attest frontend provenance
        uses: actions/attest@v4
        with:
          subject-name: ${{ steps.images.outputs.frontend_subject }}
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy to production
    if: vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
    permissions:
      contents: read
      packages: read
    env:
      SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
      SSH_PORT: ${{ secrets.PROD_SSH_PORT }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
      REMOTE_DIR: ${{ vars.PROD_DEPLOY_PATH || '/opt/trip-planner' }}
      PROD_APP_URL: ${{ vars.PROD_APP_URL }}
      GHCR_TOKEN: ${{ github.token }}
      BACKEND_IMAGE: ${{ needs.publish.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.publish.outputs.frontend_image }}
      RELEASE_SHA: ${{ needs.publish.outputs.source_sha }}
    steps:
      - name: Check out deployed configuration
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.publish.outputs.source_sha }}

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for value in SSH_HOST SSH_PORT SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS PROD_ENV_FILE; do
            if [ -z "${!value:-}" ]; then
              echo "Missing required production secret: ${value}" >&2
              exit 1
            fi
          done
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]
          (( SSH_PORT >= 1 && SSH_PORT <= 65535 ))
          [[ "$SSH_USER" =~ ^[A-Za-z_][A-Za-z0-9._-]*$ ]]
          [[ "$REMOTE_DIR" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [ "$REMOTE_DIR" != "/" ]
          [[ ! "$REMOTE_DIR" =~ (^|/)\.\.(/|$) ]]

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_deploy" "$HOME/.ssh/known_hosts"

      - name: Build server environment file
        shell: bash
        run: |
          python - <<'PY'
          import os
          import base64
          import re
          from pathlib import Path
          from urllib.parse import urlsplit

          raw = os.environ["PROD_ENV_FILE"].replace("\r\n", "\n").strip()
          kept = []
          values = {}
          managed = {"APP_ENV_FILE", "BACKEND_IMAGE", "FRONTEND_IMAGE", "RELEASE_SHA"}
          forbidden = {"COMPOSE_FILE", "COMPOSE_PROJECT_NAME"}
          for line in raw.splitlines():
              stripped = line.strip()
              if not stripped or stripped.startswith("#"):
                  kept.append(line)
                  continue
              if "=" not in line:
                  raise SystemExit(f"Invalid PROD_ENV_FILE line: {line!r}")
              key, value = line.split("=", 1)
              key = key.strip()
              if not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_]*", key):
                  raise SystemExit(f"Invalid environment variable name: {key!r}")
              if key in forbidden:
                  raise SystemExit(f"PROD_ENV_FILE must not define {key}")
              if key in managed:
                  continue
              if "\x00" in value or "\n" in value:
                  raise SystemExit(f"Invalid value for {key}")
              values[key] = value.strip()
              kept.append(f"{key}={value}")

          required = ("POSTGRES_PASSWORD", "REDIS_PASSWORD", "ENCRYPTION_KEY", "FRONTEND_ORIGIN")
          for key in required:
              value = values.get(key, "")
              if not value or "change_me" in value.lower() or value.lower().startswith("replace_"):
                  raise SystemExit(f"PROD_ENV_FILE must contain a production value for {key}")

          for key in ("POSTGRES_PASSWORD", "REDIS_PASSWORD"):
              if not re.fullmatch(r"[A-Za-z0-9_-]{24,}", values[key]):
                  raise SystemExit(f"{key} must be at least 24 URL-safe characters")

          for key in ("POSTGRES_USER", "POSTGRES_DB"):
              if key in values and not re.fullmatch(r"[A-Za-z_][A-Za-z0-9_-]*", values[key]):
                  raise SystemExit(f"{key} contains unsupported characters")

          try:
              if len(base64.urlsafe_b64decode(values["ENCRYPTION_KEY"].encode("ascii"))) != 32:
                  raise ValueError
          except (ValueError, UnicodeError):
              raise SystemExit("ENCRYPTION_KEY must be a valid Fernet key") from None

          origin = urlsplit(values["FRONTEND_ORIGIN"])
          if origin.scheme != "https" or not origin.netloc or origin.path not in ("", "/"):
              raise SystemExit("FRONTEND_ORIGIN must be an HTTPS origin without a path")

          kept.extend(
              [
                  f"BACKEND_IMAGE={os.environ['BACKEND_IMAGE']}",
                  f"FRONTEND_IMAGE={os.environ['FRONTEND_IMAGE']}",
                  f"RELEASE_SHA={os.environ['RELEASE_SHA']}",
              ]
          )
          Path(".env.production.next").write_text("\n".join(kept) + "\n", encoding="utf-8")
          PY

      - name: Upload deployment bundle
        shell: bash
        run: |
          set -euo pipefail
          target="${SSH_USER}@${SSH_HOST}"
          ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" "$target" \
            "mkdir -p '$REMOTE_DIR' && chmod 700 '$REMOTE_DIR'"
          scp -i "$HOME/.ssh/id_deploy" -P "$SSH_PORT" \
            compose.production.yml "$target:$REMOTE_DIR/compose.production.yml.next"
          scp -i "$HOME/.ssh/id_deploy" -P "$SSH_PORT" \
            .env.production.next "$target:$REMOTE_DIR/.env.production.next"
          scp -i "$HOME/.ssh/id_deploy" -P "$SSH_PORT" \
            ops/deploy-production.sh "$target:$REMOTE_DIR/deploy-production.sh.next"
          scp -i "$HOME/.ssh/id_deploy" -P "$SSH_PORT" \
            ops/backup-postgres.sh "$target:$REMOTE_DIR/backup-postgres.sh.next"

      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail
          target="${SSH_USER}@${SSH_HOST}"
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/id_deploy" -p "$SSH_PORT" "$target" \
            "set -e; mv '$REMOTE_DIR/deploy-production.sh.next' '$REMOTE_DIR/deploy-production.sh'; mv '$REMOTE_DIR/backup-postgres.sh.next' '$REMOTE_DIR/backup-postgres.sh'; chmod 700 '$REMOTE_DIR/deploy-production.sh' '$REMOTE_DIR/backup-postgres.sh'; docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin; trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT; cd '$REMOTE_DIR'; ./deploy-production.sh"

      - name: Verify public health endpoint
        if: env.PROD_APP_URL != ''
        shell: bash
        run: |
          curl --fail --show-error --silent \
            --retry 10 --retry-delay 5 --retry-all-errors --max-time 10 \
            "${PROD_APP_URL%/}/api/health"
